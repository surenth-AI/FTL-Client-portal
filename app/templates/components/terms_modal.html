<!-- TERMS & CONDITIONS FULL-SCREEN VIEWER (open with openTermsModal()) -->
<div id="termsModal" style="display:none; position:fixed; inset:0; z-index:2000; background:#fff; flex-direction:column;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1.25rem; border-bottom:1px solid #e2e8f0; background:#f8fafc;">
        <div class="d-flex align-items-center gap-2">
            <img src="{{ url_for('static', filename='img/terms_conditions.png') }}" alt="" style="width:28px;height:28px;object-fit:contain;">
            <span style="font-weight:600; font-size:1rem; color:#0f172a;">Terms &amp; Conditions</span>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="closeTermsModal()" title="Close (Esc)"><i class="bi bi-x-lg"></i> Close</button>
    </div>
    <div id="termsFrameContainer" style="position:relative; flex:1; width:100%; height:100%;">
        <div id="termsLoading" style="display:none; position:absolute; inset:0; align-items:center; justify-content:center; color:#64748b; background:#fff; z-index:10;">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div> Loading…
        </div>
    </div>
</div>

<script>
(function() {
    let isTermsModalOpen = false;
    let isClosingProgrammatically = false;

    function loadTermsFrame() {
        let frame = document.getElementById('termsFrame');
        if (frame) return;

        const container = document.getElementById('termsFrameContainer');
        if (!container) return;
        const loading = document.getElementById('termsLoading');
        if (loading) loading.style.display = 'flex';

        frame = document.createElement('iframe');
        frame.id = 'termsFrame';
        frame.title = 'Terms & Conditions';
        frame.style.width = '100%';
        frame.style.height = '100%';
        frame.style.border = '0';
        frame.style.position = 'relative';

        frame.onload = function() {
            if (loading) loading.style.display = 'none';
            try {
                if (frame.contentWindow) {
                    frame.contentWindow.addEventListener('keydown', function(e) {
                        if (e.key === 'Escape' && isTermsModalOpen) {
                            closeTermsModal();
                        }
                    });
                }
            } catch (err) {}
        };

        // Setting src before appendChild guarantees no additional joint history entry is created
        frame.src = '{{ url_for("customer.terms_conditions") }}';
        container.appendChild(frame);
    }

    function openTermsModal(fromHistory) {
        const modal = document.getElementById('termsModal');
        if (!modal) return;

        isClosingProgrammatically = false;
        loadTermsFrame();

        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        isTermsModalOpen = true;

        if (!fromHistory) {
            if (window.location.hash !== '#terms-view') {
                try {
                    history.pushState({ termsModal: true }, '', '#terms-view');
                } catch (e) {
                    window.location.hash = '#terms-view';
                }
            }
        }
    }

    function closeTermsModal(fromHistory) {
        const modal = document.getElementById('termsModal');
        if (modal) {
            modal.style.display = 'none';
        }
        document.body.style.overflow = '';

        if (!isTermsModalOpen) return;
        isTermsModalOpen = false;

        if (!fromHistory) {
            if (window.location.hash === '#terms-view') {
                isClosingProgrammatically = true;
                try {
                    history.back();
                } catch (e) {
                    isClosingProgrammatically = false;
                    if (window.location.hash === '#terms-view') {
                        history.replaceState(null, '', window.location.pathname + window.location.search);
                    }
                }
            }
        }
    }

    function handleModalHistoryChange() {
        if (isClosingProgrammatically) {
            isClosingProgrammatically = false;
            return;
        }

        if (window.location.hash === '#terms-view') {
            if (!isTermsModalOpen) {
                openTermsModal(true);
            }
        } else {
            if (isTermsModalOpen) {
                closeTermsModal(true);
            }
        }
    }

    window.addEventListener('popstate', handleModalHistoryChange);
    window.addEventListener('hashchange', handleModalHistoryChange);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isTermsModalOpen) {
            closeTermsModal();
        }
    });

    // Clean up any lingering hash from previous page refreshes
    if (window.location.hash === '#terms-view') {
        try {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        } catch (e) {}
    }

    // Expose functions globally for inline onclick triggers
    window.openTermsModal = openTermsModal;
    window.closeTermsModal = closeTermsModal;
})();
</script>
